name: rickipedia
description: "Rickipedia — лабораторная работа 4, API и BLoC."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  talker: ^5.1.20
  talker_flutter: ^5.1.20
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  talker_dio_logger: ^5.1.20
  talker_bloc_logger: ^5.1.20
  json_annotation: 4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.17.1
  json_serializable: 6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
